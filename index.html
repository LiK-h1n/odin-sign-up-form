<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="art">
        <div class="title">
          <div class="logo">
            <img src="Images/logo.png" alt="Odin logo" />
          </div>
          <div class="heading">
            <h1>Odin</h1>
          </div>
        </div>
        <div class="attribute">
          <p>
            Photo by
            <a
              href="https://unsplash.com/@aarsoph?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
              >Kristijan Arsov</a
            >
            on
            <a
              href="https://unsplash.com/photos/closeup-photo-of-brown-wooden-statue-tcw3nwoAgvs?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
              >Unsplash</a
            >
          </p>
        </div>
      </div>
      <div class="content">
        <div class="message">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p>Sign up now to get started.</p>
          <p>You know you want to.</p>
        </div>
        <div class="details">
          <div class="opening">
            <p>Let's do this !</p>
          </div>
          <div class="form">
            <form action="">
              <div class="left"></div>
              <div class="right"></div>
            </form>
          </div>
        </div>
        <div class="create">
          <div class="button">
            <button type="submit">Create Account</button>
          </div>
          <div class="log-in">
            <p>Already have an account?</p>
            <a href="">Log in</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
